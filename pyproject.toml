[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "avid-mach4-post"
version = "0.1.0"
description = "AVID CNC / Mach4 post processor for the FreeCAD CAM workbench"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools]
py-modules = ["avid_mach4_post"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 79
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
